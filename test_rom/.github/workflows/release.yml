name: Release ROM suite

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build release
        run: |
          python generate.py --output dist
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          zip -9 -r "pygameboy-test-rom-${GITHUB_REF_NAME}.zip" \
            dist README.md LICENSE SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "pygameboy-test-rom-${GITHUB_REF_NAME}.zip"
          SHA256SUMS
          --generate-notes
