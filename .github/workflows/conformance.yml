name: Conformance report

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    env:
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"

    steps:
      - name: Checkout PyGameBoy
        uses: actions/checkout@v6

      - name: Checkout pinned Blargg ROMs
        uses: actions/checkout@v6
        with:
          repository: retrio/gb-test-roms
          ref: c240dd7d700e5c0b00a7bbba52b53e4ee67b5f15
          path: .conformance/blargg

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install "uv==0.12.0"

      - name: Sync locked environment
        run: uv sync --frozen --extra dev

      - name: Run conformance floor
        run: |
          mkdir -p conformance-site
          uv run --frozen pygameboy-conformance \
            tests/roms/mooneye \
            .conformance/blargg/cpu_instrs/individual \
            .conformance/blargg/instr_timing/instr_timing.gb \
            .conformance/blargg/mem_timing/mem_timing.gb \
            .conformance/blargg/mem_timing-2/rom_singles \
            .conformance/blargg/dmg_sound/rom_singles/01-registers.gb \
            .conformance/blargg/oam_bug/rom_singles/3-non_causes.gb \
            .conformance/blargg/oam_bug/rom_singles/6-timing_no_bug.gb \
            --max-instructions 10000000 \
            --json conformance-site/results.json \
            --badge conformance-site/badge.json \
            --markdown conformance-site/summary.md \
            --html conformance-site/index.html

      - name: Add report to the Actions summary
        run: cat conformance-site/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload downloadable report
        uses: actions/upload-artifact@v7
        with:
          name: pygameboy-conformance-${{ github.sha }}
          path: conformance-site
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: conformance-site

  deploy:
    if: github.event_name == 'push'
    needs: report
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy conformance dashboard
        id: deployment
        uses: actions/deploy-pages@v4
