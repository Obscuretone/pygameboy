[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pygameboy"
version = "0.1.0"
description = "A performance-focused Nintendo Game Boy emulator in Python"
readme = "readme.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Evan D'Entremont" }]
keywords = ["emulator", "game-boy", "pygame", "lr35902"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "numpy>=1.24,<3",
  "pygame>=2.5,<3",
]

[project.optional-dependencies]
audio = ["sounddevice>=0.4,<1"]
dev = [
  "pillow>=10,<13",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
pygameboy = "emulator:main"
pygameboy-conformance = "conformance:main"

[project.urls]
Homepage = "https://github.com/Obscuretone/pygameboy"
Repository = "https://github.com/Obscuretone/pygameboy"
Issues = "https://github.com/Obscuretone/pygameboy/issues"

[tool.setuptools]
py-modules = [
  "apu",
  "audit_cpu",
  "benchmark_cpu",
  "cartridge_save",
  "clock",
  "conformance",
  "constants",
  "emulator",
  "gb_types",
  "joypad",
  "mbc",
  "memory",
  "protocols",
  "pygame_environment",
  "serial_cable",
  "video",
]

[tool.setuptools.packages.find]
include = ["cpu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
omit = [
  "tests/*",
  "audit_cpu.py",
  "benchmark_cpu.py",
  "refactor.py",
  "test_rom/generate.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = ["venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"cpu/opcodes.py" = ["E702"]
